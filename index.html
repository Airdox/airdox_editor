<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>airdox_SMART_Editor</title>
    <meta name="description" content="airdox_SMART_Editor – Professioneller DJ-Audio-Editor mit nicht-destruktivem Rekordbox-Import, Beatgrid-Synchronisation, Echtzeit-Audio-Engine und Palette-Clips." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' airdox://app 'unsafe-inline'; img-src 'self' airdox://app data: blob:; media-src 'self' airdox://app data: blob:; font-src 'self' airdox://app https://fonts.gstatic.com data:; style-src 'self' airdox://app 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' airdox://app 'unsafe-inline' 'unsafe-eval'; connect-src 'self' airdox://app;" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      /* Notfall-Styling: bleibt das Bundle hängen, erscheint eine Meldung statt
         eines leeren weissen Fensters. */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0b0d;
        color: #c8c9ce;
        overflow: hidden;
      }
      #root:empty::before {
        content: "airdox_SMART_Editor wird geladen…";
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #7c828f;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #root.fatal {
        padding: 24px;
        box-sizing: border-box;
        overflow: auto !important;
        font: 12px/1.5 ui-monospace, "JetBrains Mono", Consolas, monospace;
        color: #ff6b6b;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Globaler Schutz gegen komplett weissen Bildschirm bei Startfehlern
      // VOR dem Mounten von React.
      window.addEventListener('error', function (ev) {
        var root = document.getElementById('root');
        if (!root) return;
        root.classList.add('fatal');
        var msg = (ev.error && ev.error.stack) || ev.message || String(ev.error) || 'Unbekannter Fehler';
        root.textContent =
          'airdox_SMART_Editor – Startfehler\n\n' +
          msg +
          '\n\nDrücke F12 für Entwicklerwerkzeuge.';
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var root = document.getElementById('root');
        if (!root || root.classList.contains('fatal')) return;
        root.classList.add('fatal');
        var reason = ev.reason && (ev.reason.stack || ev.reason.message || String(ev.reason));
        root.textContent =
          'airdox_SMART_Editor – Unbehandelter Promise-Fehler\n\n' +
          (reason || String(ev.reason)) +
          '\n\nDrücke F12 für Entwicklerwerkzeuge.';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
