# EDMSMOKE BS-RoFormer – vom Stem Isolation Gate (TEIL 2) verwendetes Smoke-Trainingsmodell.
#
# Architektur identisch zur Referenz (Band-Split, RoPE-Transformer, Mask-Estimator),
# aber absichtlich klein (dim 64 / depth 3 / 4 Stems), damit Training und Inferenz
# auf CPU (2 Kerne) in Minuten statt Stunden laufen.
#
# WICHTIG: Der zugehoerige Checkpoint wird auf SYNTHETISCHEM Material trainiert
# (generatorEdmTestTrack-Distribution mit anderem Seed-Vorrat als der Eval-Track).
# Er belegt den trainierten Pfad (weights="checkpoint") END-TO-END und ist KEIN
# Ersatz fuer das MUSDB18-HQ-Modell. Erst `model_bs_roformer_ep_17_sdr_9.6568.ckpt`
# (siehe src/stems/modelCatalog.json) liefert produktionsnahe Qualitaet.
audio:
  chunk_size: 131584
  dim_f: 1024
  dim_t: 258
  hop_length: 512
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.000

model:
  dim: 64
  depth: 3
  stereo: true
  num_stems: 4
  time_transformer_depth: 1
  freq_transformer_depth: 1
  linear_transformer_depth: 0
  freqs_per_bands: !!python/tuple
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 12
    - 12
    - 12
    - 12
    - 12
    - 12
    - 12
    - 12
    - 24
    - 24
    - 24
    - 24
    - 24
    - 24
    - 24
    - 24
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 128
    - 129
  dim_head: 16
  heads: 4
  attn_dropout: 0.0
  ff_dropout: 0.0
  flash_attn: false
  dim_freqs_in: 1025
  stft_n_fft: 2048
  stft_hop_length: 512
  stft_win_length: 2048
  stft_normalized: false
  mask_estimator_depth: 1
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
    - 4096
    - 2048
    - 1024
    - 512
    - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: false
  use_torch_checkpoint: false
  skip_connection: false

training:
  batch_size: 1
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments:
    - vocals
    - bass
    - drums
    - other
  lr: 3.0e-04
  patience: 2
  reduce_factor: 0.95
  target_instrument:
  num_epochs: 1
  num_steps: 1
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adam
  other_fix: false
  use_amp: false

inference:
  batch_size: 1
  dim_t: 258
  num_overlap: 4
  chunk_size: 131584
