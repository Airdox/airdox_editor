name: Native SQLCipher + Master DB Gate

# Separater Linux-Native-Test. Der Windows-Installer-Workflow bleibt davon
# unabhängig; dieser Workflow beweist explizit den SQLCipher-Build und lädt
# danach das produktive Master-DB-Gate ohne einen injizierten Testtreiber.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_master_db:
        description: >-
          Optional: private master.db from REKORDBOX_MASTER_DB_URL secret
          (never committed or uploaded as an artifact)
        required: false
        default: false
        type: boolean
      real_track_id:
        description: Optional djmdContent.ID for the private master.db (blank = first track)
        required: false
        type: string

concurrency:
  group: native-sqlcipher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-master-db-regression:
    name: Fast injectable Master-DB regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tests/master-db-gate.test.mjs deliberately retains its node:sqlite
      # injectable path. node:sqlite is available in Node 22; the actual
      # native SQLCipher job below remains pinned to the project's Node 20 ABI.
      - name: Node.js 22 für den injectable Testpfad aufsetzen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test-Abhängigkeiten installieren
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Injectable Master-DB-Gate ausführen
        run: node tests/master-db-gate.test.mjs

  native-sqlcipher:
    name: Build and validate real SQLCipher native driver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20 aufsetzen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build-Toolchain installieren
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            python3 \
            make \
            g++ \
            pkg-config

      - name: Toolchain und Node-Version dokumentieren
        run: |
          set -euxo pipefail
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Python: $(python3 --version)"
          echo "g++: $(g++ --version | head -n 1)"
          echo "make: $(make --version | head -n 1)"
          echo "pkg-config: $(pkg-config --version)"
          echo "Runner: ${RUNNER_OS} / ${RUNNER_ARCH}"

      - name: Dependencies aus package-lock.json installieren
        run: |
          set -euxo pipefail
          npm ci --include=optional --foreground-scripts --no-audit --no-fund

      - name: Optionale native Dependency sicherstellen
        run: |
          set -euxo pipefail
          # npm behandelt fehlgeschlagene optionale Install-Scripts als
          # Warnung und kann das Paket deshalb entfernen. Nur in diesem
          # Ausnahmefall wird exakt die Lockfile-Version ohne Install-Script
          # nachgeholt; der verbindliche Source-Build folgt im nächsten Schritt.
          if [ ! -f node_modules/better-sqlite3-multiple-ciphers/package.json ]; then
            echo "::warning::better-sqlite3-multiple-ciphers wurde von npm ci nicht materialisiert; installiere die Lockfile-Version gezielt nach."
            version="$(node -p "require('./package-lock.json').packages['node_modules/better-sqlite3-multiple-ciphers'].version")"
            npm install --no-save --package-lock=false --ignore-scripts \
              "better-sqlite3-multiple-ciphers@${version}"
          fi

      - name: SQLCipher-Abhängigkeit und Build-Konfiguration dokumentieren
        run: |
          set -euxo pipefail
          npm ls better-sqlite3-multiple-ciphers --depth=0
          node - <<'NODE'
          const pkg = require('./node_modules/better-sqlite3-multiple-ciphers/package.json');
          console.log(`better-sqlite3-multiple-ciphers: ${pkg.version}`);
          console.log(`install script: ${pkg.scripts?.install || '(none)'}`);
          console.log(`module entry: ${require.resolve('better-sqlite3-multiple-ciphers')}`);
          NODE

      - name: Native SQLCipher für den Runner aus dem Source bauen
        env:
          npm_config_build_from_source: 'true'
        run: |
          set -euxo pipefail
          # Die Dependency nutzt prebuild-install || node-gyp rebuild. Mit
          # build_from_source=true wird ein vorhandenes Prebuild absichtlich
          # nicht verwendet; node-gyp kompiliert das Binding auf diesem Runner.
          npm rebuild better-sqlite3-multiple-ciphers \
            --build-from-source \
            --foreground-scripts \
            --loglevel verbose
          node - <<'NODE'
          const Database = require('better-sqlite3-multiple-ciphers');
          const db = new Database(':memory:');
          const row = db.prepare('SELECT sqlite_version() AS version').get();
          console.log(`Native binding loaded after source build; SQLite ${row.version}`);
          db.close();
          NODE

      - name: CI-Artefaktverzeichnis vorbereiten
        if: always()
        run: mkdir -p ci-artifacts

      - name: ECHTER SQLCipher-Smoke-Test und reales Master-DB-Gate
        run: |
          set -euo pipefail
          npm run test:masterdb:real -- \
            --report ci-artifacts/sqlcipher-native-gate.json \
            2>&1 | tee ci-artifacts/sqlcipher-native-gate.log

      # Optionaler manueller Modus für ein privates Test-Repository oder einen
      # privaten HTTPS-Artefaktspeicher. Die Datei liegt nur unter /tmp und
      # wird weder in Git noch in das CI-Artefakt hochgeladen.
      - name: Optionales echtes Rekordbox master.db Gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_master_db == true }}
        env:
          MASTER_DB_URL: ${{ secrets.REKORDBOX_MASTER_DB_URL }}
          MASTER_DB_TOKEN: ${{ secrets.REKORDBOX_MASTER_DB_TOKEN }}
          REAL_TRACK_ID: ${{ inputs.real_track_id }}
        run: |
          set -euo pipefail
          test -n "${MASTER_DB_URL}" || {
            echo "REKORDBOX_MASTER_DB_URL secret fehlt" >&2
            exit 1
          }
          mkdir -p ci-artifacts
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${MASTER_DB_TOKEN}" \
            "${MASTER_DB_URL}" \
            --output /tmp/airdox-private-master.db
          args=(--db /tmp/airdox-private-master.db --report ci-artifacts/real-master-db-gate.json)
          if [ -n "${REAL_TRACK_ID}" ]; then
            args+=(--track "${REAL_TRACK_ID}")
          fi
          set -o pipefail
          npm run test:masterdb:real -- "${args[@]}" \
            2>&1 | tee ci-artifacts/real-master-db-gate.log

      - name: Private master.db löschen
        if: always()
        run: rm -f /tmp/airdox-private-master.db

      - name: SQLCipher-Logs und Reports als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-native-gate-${{ github.run_id }}
          path: ci-artifacts/**
          if-no-files-found: warn
          retention-days: 30
