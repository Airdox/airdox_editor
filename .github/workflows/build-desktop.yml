name: Build & Release Native Windows Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Native SQLCipher Module
        run: npm run rekordbox:native:rebuild --force

      - name: Build Desktop Application (.exe)
        run: npm run package:win:portable

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airdox_SMART_Editor_Portable
          path: release/*.exe
