name: CI - Tests & Build

on:
  push:
    branches: [ main, master, feature/*, arena/*, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with pytest (Mock Mode)
      env:
        USE_MOCK_DRIVE: "1"
      run: |
        pytest tests/ -v --cov=audio_editor --cov-report=term-missing

    - name: Test existing editor basis still works
      env:
        USE_MOCK_DRIVE: "1"
      run: |
        pytest tests/test_existing_editor.py tests/test_deck_integration.py -v

  test-electron:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: TypeScript Check
      run: npm run lint || true
    - name: Package.json valid
      run: npm run test:package

  build-linux:
    runs-on: ubuntu-latest
    needs: test-python
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build executable (Linux)
      run: |
        pyinstaller --name=AudioEditor --windowed --onedir audio_editor/main.py --noconfirm || true
        ls -lh dist/ || echo "No dist"
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioEditor-Linux-${{ github.sha }}
        path: dist/
        retention-days: 7

  build-windows-python:
    runs-on: windows-latest
    needs: test-python
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build Windows EXE (Python Cloud Feature)
      run: |
        pyinstaller --name=AudioEditor --windowed --onedir --collect-all=PySide6 --collect-all=shiboken6 --exclude-module=torch --exclude-module=torchaudio --exclude-module=demucs audio_editor/main.py --noconfirm
        dir dist/AudioEditor/
    - name: Create Windows ZIP
      run: |
        Compress-Archive -Path dist/AudioEditor -DestinationPath AudioEditor-Windows-Python-${{ github.sha }}.zip
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioEditor-Windows-Python-${{ github.sha }}
        path: AudioEditor-Windows-Python-*.zip
        retention-days: 7
