name: CI - Tests & Build

on:
  push:
    branches: [ main, master, feature/*, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with pytest (Mock Mode)
      env:
        USE_MOCK_DRIVE: "1"
      run: |
        pytest tests/ -v --cov=audio_editor --cov-report=term-missing --cov-report=xml

    - name: Test existing editor basis still works
      env:
        USE_MOCK_DRIVE: "1"
      run: |
        pytest tests/test_existing_editor.py -v
        pytest tests/test_deck_integration.py -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install lint tools
      run: |
        pip install flake8 black isort
    - name: Lint with flake8
      run: |
        flake8 audio_editor/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 audio_editor/ --count --max-complexity=15 --max-line-length=120 --statistics || true

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build executable (Linux)
      run: |
        python build_windows.py || echo "Build script failed, trying direct pyinstaller"
        pyinstaller --name=AudioEditor --windowed --onedir audio_editor/main.py --noconfirm || true
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioEditor-Linux
        path: dist/

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build Windows EXE
      run: |
        pyinstaller --name=AudioEditor --windowed --onedir --collect-all=PySide6 --collect-all=shiboken6 --exclude-module=torch --exclude-module=torchaudio --exclude-module=demucs audio_editor/main.py --noconfirm
    - name: Create Windows Release ZIP
      run: |
        Compress-Archive -Path dist/AudioEditor -DestinationPath AudioEditor-Windows-${{ github.sha }}.zip
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioEditor-Windows
        path: AudioEditor-Windows-*.zip
