name: Windows-Build

on:
  push:
    branches: ['main', 'release/**', 'arena/**']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:      # manuell auf Knopfdruck
  schedule:
    - cron: '0 3 * * *'  # daily 03:00 UTC full suite

# Schnelle Folge-Pushes: nur der neueste Lauf pro Ref baut.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write         # wird für das Erstellen von GitHub-Releases benötigt

jobs:
  build:
    name: Windows Installer + Portable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js aufsetzen
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Package.json validieren
        run: npm run test:package

      - name: Notebook Manifest prüfen
        run: npm run stems:gate:notebook -- --check

      - name: Stem Engine Tests
        run: npm run test:stems

      - name: TypeScript-Prüfung
        run: npm run lint

      - name: Renderer bauen (Vite)
        run: npm run build

      - name: Waveform-Gates / Quellenherkunft verifizieren
        run: npm run verify:waveform

      - name: Full test suite (schedule/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test

      - name: Electron Windows-Pakete (NSIS + Portable)
        run: npx electron-builder --win nsis --win portable --publish never
        env:
          # Kein Signieren in der offenen CI
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artefakte anhängen (immer)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: airdox-smart-editor-windows
          path: release/*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Failure report hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-runner-failure
          path: test-runner-failure.txt
          retention-days: 14
          if-no-files-found: warn

      - name: GitHub-Release bei Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: airdox_SMART_Editor ${{ github.ref_name }}
          files: release/*.exe
          generate_release_notes: true
