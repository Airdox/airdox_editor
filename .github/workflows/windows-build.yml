name: Windows-Build

on:
  push:
    branches: [ main, arena/01a103d9-airdox-editor ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-model:
    name: Echter Modelllauf + Export-Notebook bis AUTH_REQUIRED (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: colab/requirements-worker.txt
      - run: npm ci --ignore-scripts
      - name: Modellruntime installieren
        run: |
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r colab/requirements-worker.txt
          python -m pip install --no-deps msst==0.1.0
          python -m pip check
      - name: Verifiziertes Modell und Preflight
        run: node scripts/evidence-run.mjs model-preflight -- python colab/remote_setup.py --model-dir stem-gate-run/models --device cpu
      - name: Echter Modelllauf und Editor-Rückimport (44.1 und 48 kHz)
        run: node scripts/evidence-run.mjs model-live -- node scripts/run-tests.mjs --only stem-remote-real-model-live --fail-on-skip --timeout 1200000
        env:
          AIRODOX_STEM_MODEL_DIR: ${{ github.workspace }}/stem-gate-run/models
          AIRODOX_STEM_PYTHON: python
      - name: Export-Notebook bauen
        run: npm run stems:remote:bundle
      - name: Tatsächlich ausgeliefertes Notebook bis zur Google-Grenze ausführen
        run: node scripts/evidence-run.mjs notebook-preauth -- python scripts/test_colab_preauth.py --model-dir stem-gate-run/models
      - name: Rohbericht in Nachweiskette übernehmen
        run: cp stem-gate-run/remote-real-model-evidence.json evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: Colab_PreAuth_Evidence
          path: evidence/
          if-no-files-found: error
      - name: Fehlerdiagnose
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Colab_PreAuth_Diagnostics
          path: |
            evidence/
            stem-gate-run/remote-real-model-evidence.json
            test-runner-failure.txt
          if-no-files-found: warn

  cli-auth:
    name: Offizieller Colab-CLI bis zur OAuth-Eingabe (ohne Zugangsdaten)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original-CLI installieren und echte Autorisierungsgrenze erreichen
        run: node scripts/evidence-run.mjs cli-auth-boundary -- python colab/cli_auth.py prepare --directory "${{ runner.temp }}/airdox-cli" --report evidence/cli-auth-boundary-report.json --source-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Colab_Auth_Boundary_Evidence
          path: evidence/
          if-no-files-found: error

  build:
    name: Windows EXEs mit verpflichtender Nachweiskette
    outputs:
      candidate-id: ${{ steps.candidate.outputs.artifact-id }}
    needs: [remote-model, cli-auth]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Nachweise genau dieses Workflow-Laufs laden
        uses: actions/download-artifact@v4
        with:
          name: Colab_PreAuth_Evidence
          path: evidence
      - name: OAuth-Grenznachweis desselben Laufs laden
        uses: actions/download-artifact@v4
        with:
          name: Colab_Auth_Boundary_Evidence
          path: evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Native Module für Electron neu bauen
        run: npm run rekordbox:native:ensure
      - name: Typprüfung
        run: node scripts/evidence-run.mjs windows-types -- npm run lint
      - name: Notebook-Vertrag
        run: node scripts/md-to-notebook.mjs colab/airdox-stem-remote-worker.md --check
      - name: Frontend und Engine bauen
        run: npm run build
      - name: Test-Suite mit Einzelberichten
        run: node scripts/evidence-run.mjs windows-tests -- npm test
      - name: Windows Setup und portable EXE bauen (ohne Nachweise Abbruch)
        run: node scripts/evidence-run.mjs windows-build -- npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIRDOX_REQUIRE_EVIDENCE: '1'
      - name: Gepackte Windows-App, IPC und eingebettete Nachweise prüfen
        run: node scripts/evidence-run.mjs windows-smoke -- pwsh -NoProfile -File scripts/windows-packaged-smoke.ps1
      - name: Prüfsummen erstellen
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content release\SHA256SUMS.txt
      - name: Gemeinsame Auslieferung versiegeln und unabhängig prüfen
        run: |
          python scripts/release_evidence.py finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_evidence.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\delivery\PRUEFEN.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Kandidat für unabhängige Download-Abnahme
        id: candidate
        uses: actions/upload-artifact@v4
        with:
          name: Windows_Delivery_Candidate
          path: delivery/
          if-no-files-found: error
      - name: Fehlerdiagnose
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows_Build_Diagnostics
          path: |
            evidence/
            test-runner-failure.txt
            ${{ runner.temp }}/airdox-smoke/
          if-no-files-found: warn

  delivery-audit:
    name: Tatsächliche Downloads unabhängig prüfen und erst dann ausliefern
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zuvor ausgeliefertes Paket 0.4.4 tatsächlich herunterladen
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11288317441'
          run-id: '37162349219'
          github-token: ${{ github.token }}
          path: previous-delivery
          merge-multiple: true
      - name: Vorherigen Paketinhalt feststellen (keine neue Google-Behauptung)
        run: python scripts/audit_download.py --directory previous-delivery --expected-commit f152a669f3e53eecef4bdfb91906eb346d0ff5f0 --artifact-id 11288317441 --report previous-package-audit.json
      - name: Neuen Kandidaten auf frischen Windows-Runner herunterladen
        uses: actions/download-artifact@v4
        with:
          name: Windows_Delivery_Candidate
          path: audited-delivery
      - name: Nachweise und EXEs im Download prüfen und Prüfbericht beilegen
        run: python scripts/audit_download.py --directory audited-delivery --expected-commit "${{ github.sha }}" --artifact-id "${{ needs.build.outputs.candidate-id }}" --seal --previous-report previous-package-audit.json
      - name: Endgültigen Paketinhalt mit ausgeliefertem Prüfer prüfen
        run: '& .\audited-delivery\PRUEFEN.ps1'
      - name: Endgültiges Windows-Paket samt Nachweiskette
        uses: actions/upload-artifact@v4
        with:
          name: airdox_SMART_Editor_Windows_0.4.5_mit_Nachweisen
          path: audited-delivery/
          if-no-files-found: error
      - name: Unabhängige Prüfdiagnose
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Download_Audit_Diagnostics
          path: |
            previous-package-audit.json
            audited-delivery/NACHWEISKETTE.json
            audited-delivery/NACHWEISE/download-audit.json
          if-no-files-found: warn
