name: Windows-Build

on:
  push:
    branches: ['main', 'release/**']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:      # manuell auf Knopfdruck
  schedule:
    - cron: '0 3 * * *'  # täglich 03:00 UTC = 05:00 DE

permissions:
  contents: write         # wird für das Erstellen von GitHub-Releases benötigt

jobs:
  build:
    name: Windows Installer + Portable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js aufsetzen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: SQLCipher-Modul für Electron-ABI rebuilden (DB-Import im Release)
        # better-sqlite3-multiple-ciphers ist eine optionalDependency:
        # 'npm ci' kompiliert sie gegen das Node des Runners (ABI 115), aber
        # Electron 44 verlangt ABI 149 (NODE_MODULE_VERSION). Ohne diesen
        # Rebuild gegen die Electron-Header ist der Rekordbox-DB-Import im
        # ausgelieferten Build tot ("compiled against a different Node.js
        # version"). Der Runner hat VS Build Tools + Python vorinstalliert.
        run: |
          if (Test-Path "node_modules/better-sqlite3-multiple-ciphers") {
            npm run rebuild:electron
          } else {
            Write-Host "::warning::better-sqlite3-multiple-ciphers fehlt (optional) — DB-Import in diesem Build deaktiviert, ANLZ-PPTH-Pfad bleibt aktiv."
          }

      - name: TypeScript-Prüfung
        run: npm run lint

      - name: Renderer bauen (Vite)
        run: npm run build

      - name: Waveform-Gates / Quellenherkunft verifizieren
        # Schreibt zusätzlich release/gate-report.json (und bei Fehlschlag
        # release/gate-escalation.md) — Struktur, Retry und Eskalation.
        run: npm run verify:waveform

      - name: Electron Windows-Pakete (NSIS + Portable)
        run: npx electron-builder --win nsis --win portable --publish never
        env:
          # Kein Signieren in der offenen CI
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artefakte anhängen (immer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airdox-smart-editor-windows
          # Windows-Installer/Portable plus Gatebericht (gate-report.json)
          # und bei blockierten Gates zusätzlich die Eskalation
          # (gate-escalation.md). Läuft auch, wenn die Gates blockieren und
          # keine .exe gebaut wurde — dann enthält das Artefakt den Bericht.
          path: |
            release/*.exe
            release/gate-report.json
            release/gate-escalation.md
          retention-days: 30

      - name: GitHub-Release bei Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: airdox_SMART_Editor ${{ github.ref_name }}
          files: release/*.exe
          generate_release_notes: true
