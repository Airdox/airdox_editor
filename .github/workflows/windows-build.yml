name: Windows-Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Native Module für Electron neu bauen
        run: npm run rekordbox:native:ensure

      - name: Vite-Frontend bauen
        run: npm run build

      - name: Electron-Installer bauen (NSIS)
        run: npm run package:win:nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup-EXE als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: airdox_SMART_Editor_Windows_Setup
          path: release/*-setup.exe
          if-no-files-found: error
