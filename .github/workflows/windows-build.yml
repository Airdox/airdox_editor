name: Windows-Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python für den sprachübergreifenden Remote-Manifesttest einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run lint

      - name: Native Module für Electron neu bauen
        run: npm run rekordbox:native:ensure

      - name: Vite-Frontend bauen
        run: npm run build

      # Die Suite lief zuletzt NICHT im Build, deshalb blieben zwei echte
      # Regressionen unbemerkt (fehlende ANLZ-Fingerabdruck-Kontrolle im
      # Master-DB-Gate, von einem Reparatur-Skript gelöschte asarUnpack-Muster).
      # Der Runner meldet Fehlschläge als ::error-Annotation im Job-Log.
      - name: Test-Suite ausführen
        run: npm test

      # Die Freigabe-Teilmenge darf keine Tests aufgrund fehlender
      # Voraussetzungen überspringen. Der Check deckt u. a. die gemeinsame
      # TypeScript-/Python-Manifest-Fixture des Remote-Workers ab.
      - name: Portable Stem-Freigabetests ohne SKIPs
        run: npm run test:stems:release

      - name: Electron-Installer bauen (NSIS)
        run: npm run package:win:nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup-EXE als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: airdox_SMART_Editor_Windows_Setup
          path: release/*-setup.exe
          if-no-files-found: error
