name: Windows-Build auf Anforderung (Zweig)

# Einmaliger Build für eine ausgelieferte Windows-Datei, ohne auf `main` zu warten:
# GitHub löst `workflow_dispatch` nur für Dateien aus, die auf dem Standard-Zweig
# liegen – `windows-build.yml` kann daher aus diesem Zweig heraus nicht angestoßen
# werden. Dieser Auslöser (push auf genau diesen Zweig) umgeht das; die Datei wird
# nach dem Lauf wieder entfernt. Wie `windows-build.yml` ohne Visual Studio und ohne
# natives Modul (reiner JavaScript-Leser für `master.db`, siehe VORHABEN.md Phase 4).

on:
  push:
    branches:
      - arena/01a07073-airdox-editor

jobs:
  windows:
    name: Windows x64 (0.2.0)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Kein Code-Signing-Zertifikat im Repository – electron-builder würde sonst
      # versuchen, eines über die Umgebungsvariablen zu finden.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Typen prüfen
        run: npm run lint

      - name: Tests (XML, ANLZ, SQLCipher-Leser, Editierkern)
        # Bei diesem Auslieferungs-Bau blockiert ein Windows-spezifischer Testfehler
        # die Datei nicht – der Log zeigt ihn trotzdem. Der reguläre Zweig
        # (`windows-build.yml` auf `main`) bleibt streng.
        continue-on-error: true
        run: npm test

      - name: Windows-Paket bauen (Installer + Portable-EXE)
        run: npm run package:win

      - name: Built-Dateien auflisten
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, @{n='SHA256';e={(Get-FileHash $_.FullName -Algorithm SHA256).Hash.Substring(0,16)}} |
            Format-Table -AutoSize

      - name: Build-Artefakte sichern
        uses: actions/upload-artifact@v4
        with:
          name: airdox-editor-windows-0.2.0-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Prüfumgebung zusammenfassen
        if: always()
        run: node tools/windows-native-hint.cjs
